[package]
name = "desktop-companion"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "An offline macOS companion with a Rust command core and native AppKit controls"
license = "MIT"

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
zeroize = "=1.8.2"

[profile.release]
strip = true
lto = "thin"

